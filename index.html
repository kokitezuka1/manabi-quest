  <script>
    // 低スペック端末・動きを減らす設定の端末では、最初から軽量モード（演出を控えめに）にする
    (function () {
      var n = navigator, q = location.search, mem = n.deviceMemory, cpu = n.hardwareConcurrency;
      var apple = /iPhone|iPad|iPod|Macintosh/.test(n.userAgent);
      var slow = (mem && mem <= 2) || (!apple && cpu && cpu <= 4) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (/[?&]lite=1/.test(q) || (slow && !/[?&]lite=0/.test(q))) document.documentElement.className += ' lite';
    })();
  </script>
